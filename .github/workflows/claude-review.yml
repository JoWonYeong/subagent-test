name: Claude Review
# 토큰 절약: PR에 `ai-review` 라벨을 붙였을 때만 실행한다.
on:
  pull_request:
    types: [labeled]
jobs:
  review:
    if: github.event.label.name == 'ai-review'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            `.claude/agents/code-reviewer.md`의 기준과 보고 형식으로 이 PR(#${{ github.event.pull_request.number }})을 리뷰하라.
            기계 검사는 CI 워크플로가 하므로 실행하지 않는다.
            `docs/features/` 아래 plan.md가 있으면 기획 일치도 확인한다.
            [필수] 항목만 줄 단위 코멘트로, 나머지는 요약 코멘트 하나로 남긴다.
          claude_args: "--allowedTools Read,Grep,Glob,Bash(git diff:*),Bash(gh pr:*),mcp__github_inline_comment__create_inline_comment"
